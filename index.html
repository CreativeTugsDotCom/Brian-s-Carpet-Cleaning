                        type="text" 
                        value={currentInvoice.customerPhone}

                    <div>

                          <input 
                            type="text" 
                            value={item.desc}
                            onChange={(e) => {

                              updated[idx].desc = e.target.value;
                              setCurrentInvoice({ ...currentInvoice, items: updated });
                            }}
                            className="w-full bg-transparent text-white font-medium focus:outline-none"
                          />
                        </div>
                        <div className="col-span-2 text-center">
                          <input 
                            type="number" 
                            value={item.qty}
                            onChange={(e) => {
                              const updated = [...currentInvoice.items];
                              updated[idx].qty = parseInt(e.target.value) || 1;
                              setCurrentInvoice({ ...currentInvoice, items: updated });
                            }}
                            className="w-12 text-center bg-slate-800 rounded p-1 text-white"

    function FaqItem({ question, answer, defaultOpen = false }) {
      const [open, setOpen] = useState(defaultOpen);

      return (
        <div className="bg-white rounded-2xl border border-slate-200/90 overflow-hidden shadow-sm transition-colors">

            onClick={() => setOpen(!open)}

          >
            <span className="font-extrabold text-[#172B3A] text-sm sm:text-base leading-snug">
              {question}

            <div className={`w-8 h-8 rounded-full bg-[#F3F7FA] flex items-center justify-center shrink-0 transition-transform ${open ? "rotate-180 bg-[#20B9A8]/20 text-[#20B9A8]" : "text-slate-500"}`}>

          {open && (
            <div className="px-5 sm:px-6 pb-6 text-xs sm:text-sm text-[#637487] leading-relaxed border-t border-slate-100 pt-3">
              {answer}
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
